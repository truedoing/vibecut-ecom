<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>短剧工作台</title>
<style>
:root{
  color-scheme:dark;
  --bg:#080b10; --card:#111722; --panel-2:#171e2b; --line:#242d3d;
  --ink:#e9eef7; --sub:#8b97aa;
  --blue:#4f8cff; --bluebg:rgba(79,140,255,.14);
  --green:#34d399; --greenbg:rgba(52,211,153,.13);
  --red:#ff5d5d; --redbg:rgba(255,93,93,.13);
  --amber:#f5a524; --amberbg:rgba(245,165,36,.13);
  --violet:#a78bfa; --violetbg:rgba(167,139,250,.14);
  --greybg:#1a2230; --accent:#ff4d4f;
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 18px 44px rgba(0,0,0,.34);
  --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);
     background:
       radial-gradient(1100px 520px at 12% -12%, rgba(79,140,255,.10), transparent 62%),
       radial-gradient(900px 460px at 88% -18%, rgba(255,77,79,.08), transparent 62%),
       var(--bg);
     font:14px/1.62 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
     -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.wrap{max-width:1360px;margin:0 auto;padding:18px 24px 64px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:21px;margin:0;font-weight:680;letter-spacing:-.01em;
   display:flex;align-items:center;gap:9px}
h1::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);
           box-shadow:0 0 0 4px rgba(255,77,79,.14),0 0 18px rgba(255,77,79,.45);flex:none}
.ro{font-size:10px;color:var(--sub);background:rgba(255,255,255,.03);
    border:1px solid var(--line);padding:3px 9px;border-radius:20px;letter-spacing:.08em}
.livebadge{display:inline-flex;align-items:center;gap:6px;font-size:9px;letter-spacing:.12em;
    color:var(--sub);background:rgba(255,255,255,.03);border:1px solid var(--line);
    padding:3px 9px;border-radius:20px;line-height:1.6;white-space:nowrap}
.livebadge i{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none}
.livebadge b{font-weight:650;font-size:9px}
.livebadge.live{color:var(--accent);border-color:rgba(255,77,79,.35)}
.livebadge.live i{background:var(--accent);animation:pulse 1.4s infinite;
    box-shadow:0 0 8px rgba(255,77,79,.7)}
.livebadge.alert{color:var(--red);border-color:rgba(255,93,93,.4)}
.livebadge.alert i{background:var(--red);animation:pulse 1.4s infinite}
.livebadge.paused{color:var(--amber);border-color:rgba(245,165,36,.4)}
.livebadge.paused i{background:var(--amber)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.78)}}
.now{font-size:12px;color:var(--sub)}
.now b{color:var(--ink);font-weight:600}
nav{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 -24px 18px;
    padding:0 24px;position:sticky;top:0;z-index:30;
    background:rgba(8,11,16,.86);backdrop-filter:blur(14px)}
nav button{border:0;background:none;padding:11px 16px;font-size:14px;color:var(--sub);
           cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;
           transition:color .12s,border-color .12s,background .12s}
nav button.on{color:#fff;border-bottom-color:var(--accent);font-weight:650}
nav button:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0) 42%),var(--card);
      border:1px solid var(--line);border-radius:var(--radius);
      padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:15px;font-weight:650}
.card h3{margin:0 0 6px;font-size:14px;font-weight:650}
.muted{color:var(--sub);font-size:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;
      line-height:1.7;font-weight:550}
.pill.ok{background:var(--greenbg);color:var(--green)}
.pill.bad{background:var(--redbg);color:var(--red)}
.pill.warn{background:var(--amberbg);color:var(--amber)}
.pill.blue{background:var(--bluebg);color:var(--blue)}
.pill.flat{background:var(--greybg);color:var(--sub)}
.banner{padding:11px 14px;border-radius:10px;margin-bottom:14px;font-size:13px}
.banner.bad{background:var(--redbg);color:var(--red);border:1px solid rgba(255,93,93,.34)}
.banner.ok{background:var(--greenbg);color:var(--green);border:1px solid rgba(52,211,153,.3)}
.banner.warn{background:var(--amberbg);color:var(--amber);border:1px solid rgba(245,165,36,.3)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line)}
th{color:var(--sub);font-weight:550;font-size:11px;background:var(--panel-2);letter-spacing:.04em}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(255,255,255,.025)}
input,select{color:var(--ink);background:#0c1119;border:1px solid var(--line);
             border-radius:8px;font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid rgba(79,140,255,.4);
      outline-offset:1px}
main section{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.bar{height:7px;background:#1b2331;border-radius:5px;overflow:hidden;margin:5px 0 3px}
.bar>i{display:block;height:100%;background:var(--blue)}
/* 生产看板：四段进度，数字优先 */
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{position:relative;overflow:hidden;
      background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0) 46%),var(--card);
      border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;
      box-shadow:var(--shadow)}
.stat::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;
      background:linear-gradient(90deg,var(--sc),transparent 72%)}
.stat .sk{font-size:10px;color:var(--sub);letter-spacing:.1em}
.stat .sv{font-size:28px;font-weight:750;line-height:1.08;letter-spacing:-.03em;
      margin-top:4px;font-variant-numeric:tabular-nums}
.stat .sv .u{font-size:12px;font-weight:600;color:var(--sub);margin-left:4px;letter-spacing:0}
.stat .strack{height:4px;background:#1b2331;border-radius:99px;overflow:hidden;margin:9px 0 6px}
.stat .strack>i{display:block;height:100%;border-radius:99px}
.stat .ss{font-size:10px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.board{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
       overflow:hidden;box-shadow:var(--shadow)}
.drow{display:grid;grid-template-columns:210px repeat(4,minmax(120px,1fr));
      align-items:stretch;border-top:1px solid var(--line);position:relative}
.drow:first-child{border-top:0}
.drow:hover{background:rgba(255,255,255,.018)}
.drow.on{background:linear-gradient(90deg,rgba(255,77,79,.07),transparent 40%)}
.drow.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
                 background:var(--accent)}
.dname{padding:13px 16px;min-width:0;display:flex;flex-direction:column;
       justify-content:center;gap:3px}
.dname .dn{font-size:15px;font-weight:680;display:flex;align-items:center;gap:7px;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dname .dn .dot{flex:none;background:var(--accent);box-shadow:0 0 8px rgba(255,77,79,.7)}
.dname .dm{font-size:10px;color:var(--sub);white-space:nowrap;overflow:hidden;
           text-overflow:ellipsis}
.scell{padding:12px 16px;border-left:1px solid var(--line);min-width:0;
       display:flex;flex-direction:column;justify-content:center}
.scl{font-size:10px;color:var(--sub);display:flex;align-items:center;gap:5px;
     letter-spacing:.08em}
.scl i{width:5px;height:5px;border-radius:50%;display:inline-block;flex:none}
.scv{font-size:21px;font-weight:750;line-height:1.12;letter-spacing:-.02em;
     margin-top:2px;font-variant-numeric:tabular-nums}
.scv .u{font-size:11px;font-weight:600;color:var(--sub);margin-left:3px;letter-spacing:0}
.strack{height:3px;background:#1b2331;border-radius:99px;overflow:hidden;margin:6px 0 4px}
.strack>i{display:block;height:100%;border-radius:99px;transition:width .3s}
.scs{font-size:10px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scs.warn{color:var(--amber)}
.empty-board{padding:40px;text-align:center;color:var(--sub);font-size:13px}
.livewrap{margin-bottom:14px}
.livewrap:empty{display:none}
.live{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 46%),var(--card);
      border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
      box-shadow:var(--shadow)}
.live .lh{display:flex;align-items:center;gap:10px;padding:9px 14px;
      border-bottom:1px solid var(--line);
      background:linear-gradient(90deg,rgba(79,140,255,.08),transparent 55%)}
.live .lh .t{font-size:12px;font-weight:650;letter-spacing:.04em}
.live .lh .st{font-size:10px;color:var(--sub);margin-left:auto;font-variant-numeric:tabular-nums}
.live .lh button{font-size:10px;padding:3px 8px;border-radius:6px;background:var(--panel-2);
      border:1px solid var(--line);color:var(--sub);cursor:pointer}
.live .lh button:hover{color:var(--ink);border-color:var(--blue)}
.live .li{display:grid;grid-template-columns:210px minmax(120px,1fr) 132px;gap:14px;
      align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.live .li:first-of-type{border-top:0}
.live .li.suspect{background:rgba(255,93,93,.06)}
.live .li .job{font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live .li .job .dot{flex:none;width:6px;height:6px}
.live .li .target{font-size:10px;color:var(--sub);margin-top:2px;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
.live .li .track{height:5px;background:#1b2331;border-radius:99px;overflow:hidden;position:relative}
.live .li .track>i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.live .li .track>i.indet{animation:indet 1.2s linear infinite;border-radius:99px}
@keyframes indet{0%{transform:translateX(-120%)}100%{transform:translateX(360%)}}
.live .li .nums{display:flex;justify-content:space-between;gap:10px;font-size:10px;
      color:var(--sub);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;
      overflow:hidden}
.live .li .nums span:last-child{overflow:hidden;text-overflow:ellipsis}
.live .li .side{text-align:right;font-size:10px;color:var(--sub);line-height:1.55;
      font-variant-numeric:tabular-nums;white-space:nowrap}
.live .li .side b{display:block;font-size:13px;color:var(--ink);font-weight:700}
.live .li.suspect .side b{color:var(--red)}
tr.live td{background:rgba(79,140,255,.07)}
tr.live td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
.runrow{display:flex;align-items:center;gap:10px;font-size:12px;margin:5px 0}
.runrow .bar{flex:1;margin:0}
.runrow b{font-weight:600}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.dot.red{background:var(--red)}
/* 待审文案 */
.review{display:grid;grid-template-columns:1fr 300px;gap:14px}
.docbtn{display:inline-block;font-size:12px;padding:4px 9px;margin:3px 5px 3px 0;
        border:1px solid var(--line);border-radius:7px;background:var(--panel-2);color:var(--blue);
        cursor:pointer;font-family:inherit}
.docbtn:hover{background:var(--bluebg)}
.docbtn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.docview{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--panel-2);
         max-height:640px;overflow:auto}
.docview pre{white-space:pre-wrap;word-break:break-word;font:12px/1.7 ui-monospace,Menlo,monospace;
            margin:0;color:var(--ink)}
/* 预览（成片） */
.pvlayout{display:grid;grid-template-columns:312px minmax(0,1fr);gap:16px;align-items:start}
.pvside{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;
        position:sticky;top:12px;max-height:calc(100vh - 96px);display:flex;flex-direction:column}
.pvside .tool{padding:9px 11px;border-bottom:1px solid var(--line);display:flex;gap:6px;
              flex-wrap:wrap;align-items:center;background:var(--panel-2)}
.pvside .tool input[type=text]{flex:1;min-width:110px;font:inherit;font-size:12px;padding:5px 9px;
        border:1px solid var(--line);border-radius:7px;background:#0c1119;color:var(--ink)}
.pvside .tool label{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--sub);cursor:pointer}
.pvlist{overflow:auto;padding:7px 8px 10px}
.vgroup{border:1px solid transparent;border-radius:8px;padding:8px 9px;margin-bottom:5px;
        cursor:pointer;transition:background .12s,border-color .12s}
.vgroup:hover{background:rgba(255,255,255,.025)}
.vgroup.on{background:var(--bluebg);border-color:rgba(79,140,255,.4)}
.vgroup .t{font-size:13px;font-weight:650;line-height:1.45;display:-webkit-box;
           -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vgroup .s{font-size:11px;color:var(--sub);margin-top:3px;white-space:nowrap;
           overflow:hidden;text-overflow:ellipsis}
.vgroup .n{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px}
.vgroup .vpill{font-size:10px;padding:1px 7px;border-radius:20px;background:var(--greybg);
               color:var(--sub);white-space:nowrap}
.vgroup .vpill.ok{background:var(--greenbg);color:var(--green)}
.vgroup .vpill.warn{background:var(--amberbg);color:var(--amber)}
.vgroup .vpill.blue{background:var(--bluebg);color:var(--blue)}
.vgroup[hidden]{display:none}
.vgroup .n .c{font-size:10px;color:var(--sub);font-variant-numeric:tabular-nums}
.pvmain{display:flex;flex-direction:column;gap:12px;min-width:0}
.pvplayer{background:#0b0f14;border:1px solid #1c2530;border-radius:12px;
          display:flex;align-items:center;justify-content:center;padding:14px;min-height:340px}
.pvplayer video{max-height:70vh;max-width:100%;border-radius:8px;background:#000;
                box-shadow:0 10px 34px rgba(0,0,0,.28)}
.pvkeys{font-size:11px;color:var(--sub);margin-top:9px;text-align:center;letter-spacing:.02em}
.pvhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pvhead h2{margin:0;font-size:17px;font-weight:650;line-height:1.4}
.pvhead .sub{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.6}
.pvmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--greybg);
      color:var(--sub);white-space:nowrap;line-height:1.6}
.chip b{color:var(--ink);font-weight:600}
.chip.ok{background:var(--greenbg);color:var(--green)}
.chip.warn{background:var(--amberbg);color:var(--amber)}
.chip.blue{background:var(--bluebg);color:var(--blue)}
.vvers{display:flex;gap:6px;flex-wrap:wrap;padding:9px 11px;border:1px solid var(--line);
       border-radius:10px;background:var(--panel-2);align-items:center;border-color:var(--line)}
.vvers .lb{font-size:11px;color:var(--sub);margin-right:2px}
.vver{font:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;
      background:var(--panel-2);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.vver:hover{border-color:var(--blue);color:var(--blue)}
.vver.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.vver .r{font-size:10px;opacity:.72}
.vver .dur{font-size:10px;opacity:.72;font-variant-numeric:tabular-nums}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}
.shot{flex:0 0 134px;border:1px solid var(--line);border-radius:8px;overflow:hidden;
      background:var(--panel-2);cursor:pointer;transition:border-color .12s}
.shot:hover{border-color:var(--blue)}
.shot .im{display:flex;height:76px;background:#0b0f14}
.shot .im img{width:50%;height:100%;object-fit:cover;opacity:.95}
.shot .lb{padding:5px 7px 6px;font-size:11px;font-weight:600;line-height:1.35;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot .tm{font-size:10px;color:var(--sub);font-variant-numeric:tabular-nums;
          padding:0 7px 6px}
.selfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.selfgrid figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;
                 background:var(--panel-2);cursor:pointer}
.selfgrid figure:hover{border-color:var(--blue)}
.selfgrid img{width:100%;height:92px;object-fit:cover;display:block;background:#0a0e14}
.selfgrid figcaption{font-size:11px;padding:5px 7px;color:var(--sub);
                     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lightbox{position:fixed;inset:0;background:rgba(8,12,18,.84);z-index:60;display:flex;
          align-items:center;justify-content:center;padding:26px}
.lightbox .box{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:min(1080px,96vw);max-height:92vh;
               overflow:auto;padding:14px;position:relative}
.lightbox img{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:8px}
.lightbox .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lightbox .two img{height:62vh;object-fit:contain;background:#0b0f14}
.lightbox .cap{font-size:12px;color:var(--sub);margin-top:9px;line-height:1.7}
.lightbox .cap b{color:var(--ink)}
.lbclose{position:absolute;top:8px;right:10px;border:0;background:transparent;font-size:24px;
         color:var(--sub);cursor:pointer;line-height:1}
select,button.act{font:inherit;font-size:13px;padding:6px 11px;border:1px solid var(--line);
       border-radius:7px;background:var(--panel-2);color:var(--ink);cursor:pointer}
button.act:hover{border-color:var(--blue);color:var(--blue)}
.loading{color:var(--sub);padding:30px;text-align:center}
.err{color:var(--red)}
footer{margin-top:26px;color:var(--sub);font-size:12px;text-align:center}
@media(max-width:900px){.review,.pvlayout{grid-template-columns:1fr}
  .wrap{padding:14px 14px 48px}
  nav{margin:0 -14px 16px;padding:0 14px;overflow-x:auto}
  nav button{white-space:nowrap}
  .pvside{position:static;max-height:none}
  .statrow{grid-template-columns:1fr 1fr}
  .drow{grid-template-columns:1fr 1fr}
  .dname{grid-column:1/-1;border-bottom:1px solid var(--line)}
  .scell{border-left:0;border-top:1px solid var(--line)}
  .scell:nth-child(even){border-right:1px solid var(--line)}
  .lightbox .two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>短剧工作台</h1>
    <span class="ro">只读</span>
    <span class="livebadge" id="liveBadge"><i></i><b>IDLE</b></span>
    <span class="now" id="now"></span>
  </header>

  <nav>
    <button data-tab="pipeline" class="on">总览</button>
    <button data-tab="assets">素材分析</button>
    <button data-tab="review">待审文案</button>
    <button data-tab="video">成片预览</button>
    <button onclick="loadAll()" style="margin-left:auto;padding:10px 6px">刷新</button>
  </nav>

  <main>
    <section id="tab-pipeline"><div class="loading">正在读…</div></section>
    <section id="tab-assets" hidden><div class="loading">正在读…</div></section>
    <section id="tab-review" hidden><div class="loading">正在读…</div></section>
    <section id="tab-video" hidden><div class="loading">正在读…</div></section>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get = async p => { const r = await fetch(p); if(!r.ok) throw new Error(p+' '+r.status); return r.json(); };
let curTab = 'pipeline';
let state = {drama:'', openDoc:'', dramas:[], livePaused:false,
             vtask:'', vurl:'', vq:'', vonly:false, vbuild:false, vtimes:{}};

function tab(name){
  curTab = name;
  if(location.hash !== '#'+name) history.replaceState(null, '', '#'+name);
  document.querySelectorAll('nav button[data-tab]').forEach(b =>
    b.classList.toggle('on', b.dataset.tab === name));
  document.querySelectorAll('main section').forEach(s =>
    s.hidden = (s.id !== 'tab-'+name));
  loadAll();
}
document.querySelectorAll('nav button[data-tab]').forEach(b =>
  b.addEventListener('click', () => tab(b.dataset.tab)));

// ------------------------------------------------------------ 实时进度（LIVE）
let lastProgress = {items:[]};
let liveTimer = null, liveBusy = false, liveLastPipe = 0;
let jobStates = {};

const fmtLive = sec => {
  if(sec==null || isNaN(sec)) return '—';
  const t = Math.max(0, Math.round(Number(sec)));
  const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  return h ? h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')
           : m+':'+String(s).padStart(2,'0');
};
const fmtAgo = sec => {
  if(sec==null || sec<0) return '—';
  if(sec<5) return '刚刚';
  if(sec<60) return Math.round(sec)+' 秒前';
  if(sec<3600) return Math.round(sec/60)+' 分前';
  return Math.round(sec/3600)+' 小时前';
};
const jobTarget = x => {
  const ep = x.ep;
  if(ep==null || ep==='') return '全剧';
  if(typeof ep==='number' || /^\d+$/.test(String(ep))) return '第 '+ep+' 集';
  return String(ep);
};
const jobStateTxt = x => x.suspect ? '疑似中断'
  : x.state==='running' ? '运行中' : x.state==='failed' ? '失败' : '完成';

function liveHTML(pr){
  const items = (pr.items||[]).filter(x =>
    x.state==='running' || (x.state!=='running' && x.age_sec>=0 && x.age_sec<600));
  if(!items.length) return '';
  const order = x => x.suspect ? 0 : x.state==='running' ? 1 : x.state==='failed' ? 2 : 3;
  items.sort((a,b) => order(a)-order(b)
    || String(b.updated_at||'').localeCompare(String(a.updated_at||'')));
  const running = items.filter(x=>x.state==='running');
  const bad = running.filter(x=>x.suspect);
  const alive = running.length - bad.length;
  const title = alive ? ('正在跑 '+alive+' 个') : (bad.length ? ('有 '+bad.length+' 个异常') : '最近完成');
  const stamp = new Date().toLocaleTimeString('zh-CN',{hour12:false});
  let h = '<div class="live"><div class="lh"><span class="t">'+title
    + (bad.length && alive ? ' · '+bad.length+' 个疑似中断' : '') + '</span>'
    + '<span class="st">最后刷新 '+stamp+'</span>'
    + '<button class="act" id="livePause">'+(state.livePaused?'继续':'暂停')+'</button></div>';
  h += items.slice(0,8).map(x=>{
    const pct = x.total ? Math.round(x.done/x.total*100) : 0;
    const color = x.suspect ? 'var(--red)'
      : x.state==='running' ? 'var(--blue)'
      : x.state==='failed' ? 'var(--red)' : 'var(--green)';
    const bar = x.total
      ? '<i style="width:'+clampPct(pct)+'%;background:'+color+'"></i>'
      : '<i class="indet" style="width:30%;background:'+color+'"></i>';
    const nums = x.total
      ? (x.done+'/'+x.total+' '+esc(x.unit||'')+' · '+pct+'%')
      : '处理中';
    const side = x.state==='running'
      ? '<b>'+fmtLive(x.elapsed_sec)+'</b>'
        + (x.suspect ? (x.alive ? '心跳停了' : '进程不在')
           : (x.eta_sec!=null ? '剩 ~'+fmtLive(x.eta_sec) : '进行中'))
        + '<br>'+fmtAgo(x.age_sec)
      : '<b>'+fmtLive(x.elapsed_sec)+'</b>用时<br>'+fmtAgo(x.age_sec);
    return '<div class="li'+(x.suspect?' suspect':'')+'">'
      + '<div><div class="job"><span class="dot" style="background:'+color+'"></span>'
      + esc(x.label || x.job || '任务') + '</div>'
      + '<div class="target">'+esc(x.drama||'')+' · '+esc(jobTarget(x))
      + ' · '+esc(jobStateTxt(x))+'</div></div>'
      + '<div><div class="track">'+bar+'</div>'
      + '<div class="nums"><span>'+nums+'</span><span>'+esc(x.note||'')+'</span></div></div>'
      + '<div class="side">'+side+'</div></div>';
  }).join('');
  return h+'</div>';
}

function updateLiveBadge(pr){
  const el = $('#liveBadge');
  if(!el) return;
  const run = (pr.items||[]).filter(x=>x.state==='running');
  const bad = run.filter(x=>x.suspect);
  const cls = state.livePaused ? 'paused' : bad.length ? 'alert' : run.length ? 'live' : '';
  el.className = ('livebadge '+cls).trim();
  el.querySelector('b').textContent = state.livePaused ? 'PAUSED'
    : bad.length ? 'ALERT' : run.length ? 'LIVE' : 'IDLE';
  el.title = run.length
    ? (bad.length ? bad.length+' 个疑似中断' : run.length+' 个任务在跑')
    : '当前空闲';
}

function updateLive(pr){
  lastProgress = pr || {items:[]};
  const box = $('#live-panel');
  if(box) box.innerHTML = liveHTML(lastProgress);
  updateLiveBadge(lastProgress);
  markAssetRows(lastProgress);
}

function markAssetRows(pr){
  document.querySelectorAll('tr[data-ep]').forEach(tr=>tr.classList.remove('live'));
  (pr.items||[]).filter(x=>x.state==='running' && !x.suspect).forEach(x=>{
    const ep = String(x.ep);
    if(!/^\d+$/.test(ep)) return;
    const tr = document.querySelector('tr[data-ep="'+ep+'"]');
    if(tr) tr.classList.add('live');
  });
}

function jobEnded(pr){
  let ended = false;
  const seen = new Set();
  (pr.items||[]).forEach(x=>{
    seen.add(x.file);
    if(jobStates[x.file]==='running' && x.state!=='running') ended = true;
    jobStates[x.file] = x.state;
  });
  Object.keys(jobStates).forEach(k=>{ if(!seen.has(k)) delete jobStates[k]; });
  return ended;
}

async function liveTick(){
  if(state.livePaused || document.hidden || liveBusy) return;
  liveBusy = true;
  try{
    const pr = await get('/api/progress');
    updateLive(pr);
    if(curTab==='pipeline' && Date.now()-liveLastPipe > 6000){
      liveLastPipe = Date.now();
      await refreshPipeline();
    }
    if(curTab==='assets' && jobEnded(pr)){
      const y = window.scrollY;
      await loadAll();
      window.scrollTo(0, y);
    }
  }catch(e){
    // 监控面板不弹错；下一次 tick 再试
  }finally{
    liveBusy = false;
  }
}

function startLive(){
  if(liveTimer) return;
  liveTimer = setInterval(liveTick, 2000);
  liveTick();
}
function stopLive(){
  if(liveTimer){ clearInterval(liveTimer); liveTimer = null; }
}

// ------------------------------------------------------------ 总览：四段进度
const C = {assets:'#4f8cff', script:'#a78bfa', review:'#f5a524', final:'#34d399'};
const sumBy = (rows, f) => rows.reduce((n,p)=>n+f(p), 0);
const pctOf = (a,b) => b ? Math.round(a/b*100) : 0;
const clampPct = n => Math.max(0, Math.min(100, Math.round(Number(n)||0)));

function statTile(key, label, value, sub, color, p){
  return '<div class="stat" data-stat="'+key+'" style="--sc:'+color+'">'
    +'<div class="sk">'+label+'</div>'
    +'<div class="sv">'+value+'</div>'
    +'<div class="strack"><i style="width:'+clampPct(p)+'%;background:'+color+'"></i></div>'
    +'<div class="ss">'+esc(sub)+'</div></div>';
}
function stageCell(c){
  const color = C[c.key];
  return '<div class="scell" data-stage="'+c.key+'">'
    +'<div class="scl"><i style="background:'+color+'"></i>'+c.label+'</div>'
    +'<div class="scv">'+c.value+'</div>'
    +'<div class="strack"><i style="width:'+clampPct(c.pct)+'%;background:'+color+'"></i></div>'
    +'<div class="scs'+(c.warn?' warn':'')+'">'+esc(c.sub)+'</div></div>';
}

function pipelineModel(d){
  const rows = d.pipelines || [];
  const analyzed = sumBy(rows, p=>p.stage1.ep_count||0);
  const fullEps = sumBy(rows, p=>p.stage1.video_count||0);
  const gAssets = pctOf(sumBy(rows, p=>p.stage1.parts_done||0),
                        sumBy(rows, p=>(p.stage1.ep_count||0)*3));
  const scriptCount = sumBy(rows, p=>p.stage2.count||0);
  const taskCount = sumBy(rows, p=>p.stage2.total||0);
  const gScript = pctOf(scriptCount, taskCount);
  const reviewPassed = sumBy(rows, p=>p.review.passed.length);
  const reviewTotal = sumBy(rows, p=>p.review.total||0);
  const gReview = pctOf(reviewPassed, reviewTotal);
  const finalCount = sumBy(rows, p=>p.stage3.final_count||0);
  const finalTotal = sumBy(rows, p=>p.stage3.total||0);
  const gFinal = pctOf(finalCount, finalTotal);

  const items = rows.map(p => {
    const s1=p.stage1, s2=p.stage2, rv=p.review, s3=p.stage3;
    const eps = s1.ep_count || 0;
    const sub1 = eps ? ('已动工 '+eps+' 集')
      : ('全剧 '+(s1.video_count||0)+' 集待分析');
    const sub3 = rv.total ? (rv.passed.length+'/'+rv.total+' 条') : '还没文案';
    const sub4 = s3.total ? (s3.final_count+'/'+s3.total+' 条') : '还没文案';
    const dm = s2.total
      ? (s2.total+' 条片子 · 全剧 '+(s1.video_count||0)+' 集')
      : ('全剧 '+(s1.video_count||0)+' 集 · 还没排片子');
    return {
      drama: p.drama, active: !!p.active, dm,
      cells: [
        {key:'assets', label:'素材分析', value:s1.pct+'%', sub:sub1, pct:s1.pct, warn:false},
        {key:'script', label:'文案', value:s2.count+'<span class="u">条</span>', sub:s2.pct+'%', pct:s2.pct, warn:false},
        {key:'review', label:'审核', value:rv.total?rv.pct+'%':'—', sub:sub3, pct:rv.pct, warn:rv.revise.length>0},
        {key:'final', label:'出片', value:s3.total?s3.pct+'%':'—', sub:sub4, pct:s3.pct, warn:s3.to_remix.length>0},
      ],
    };
  });
  return {rows, items, totals:{analyzed, fullEps, gAssets, scriptCount, taskCount,
    gScript, reviewPassed, reviewTotal, gReview, finalCount, finalTotal, gFinal}};
}

function pipelineRowHTML(it){
  return '<div class="drow'+(it.active?' on':'')+'" data-drama="'+esc(it.drama)+'">'
    +'<div class="dname"><div class="dn"><span class="dot" style="'
    +(it.active?'':'visibility:hidden')+'"></span>'+esc(it.drama)+'</div>'
    +'<div class="dm">'+esc(it.dm)+'</div></div>'
    + it.cells.map(stageCell).join('')
    +'</div>';
}

function nowText(d){
  const a = d.active || {};
  return '当前 <b>'+esc(a.drama||'未选')+' / '+esc(a.task||'—')+'</b>';
}

async function renderPipeline(){
  const [d, pr] = await Promise.all([get('/api/pipelines'), get('/api/progress')]);
  const m = pipelineModel(d);
  $('#now').innerHTML = nowText(d);
  updateLiveBadge(pr);
  let h = '<div class="statrow">'
    + statTile('assets','素材分析 · 已动工', m.totals.gAssets+'%',
        m.totals.analyzed+' / 全剧 '+m.totals.fullEps+' 集', C.assets, m.totals.gAssets)
    + statTile('script','文案', m.totals.scriptCount+'<span class="u">条</span>',
        m.totals.gScript+'%', C.script, m.totals.gScript)
    + statTile('review','审核', m.totals.gReview+'%',
        m.totals.reviewPassed+' / '+m.totals.reviewTotal+' 条已过审', C.review, m.totals.gReview)
    + statTile('final','出片', m.totals.gFinal+'%',
        m.totals.finalCount+' / '+m.totals.finalTotal+' 条成片', C.final, m.totals.gFinal)
    + '</div>';
  h += '<div id="live-panel" class="livewrap">'+liveHTML(pr)+'</div>';
  h += '<div class="board">'+m.items.map(pipelineRowHTML).join('')+'</div>';
  return h;
}

function setStat(key, value, sub, p){
  const el = document.querySelector('.stat[data-stat="'+key+'"]');
  if(!el) return;
  el.querySelector('.sv').innerHTML = value;
  el.querySelector('.ss').textContent = sub;
  el.querySelector('.strack > i').style.width = clampPct(p)+'%';
}

async function refreshPipeline(){
  const d = await get('/api/pipelines');
  const m = pipelineModel(d);
  const rows = [...document.querySelectorAll('.drow[data-drama]')];
  if(rows.length !== m.items.length){ await loadAll(); return; }
  const t = m.totals;
  setStat('assets', t.gAssets+'%', t.analyzed+' / 全剧 '+t.fullEps+' 集', t.gAssets);
  setStat('script', t.scriptCount+'<span class="u">条</span>', t.gScript+'%', t.gScript);
  setStat('review', t.gReview+'%', t.reviewPassed+' / '+t.reviewTotal+' 条已过审', t.gReview);
  setStat('final', t.gFinal+'%', t.finalCount+' / '+t.finalTotal+' 条成片', t.gFinal);
  m.items.forEach(it=>{
    const row = rows.find(r=>r.dataset.drama===it.drama);
    if(!row) return;
    row.classList.toggle('on', it.active);
    const dot = row.querySelector('.dn .dot');
    if(dot) dot.style.visibility = it.active ? '' : 'hidden';
    const dm = row.querySelector('.dm');
    if(dm) dm.textContent = it.dm;
    it.cells.forEach(c=>{
      const cell = row.querySelector('.scell[data-stage="'+c.key+'"]');
      if(!cell) return;
      cell.querySelector('.scv').innerHTML = c.value;
      const sb = cell.querySelector('.scs');
      sb.textContent = c.sub;
      sb.classList.toggle('warn', !!c.warn);
      cell.querySelector('.strack > i').style.width = clampPct(c.pct)+'%';
    });
  });
  $('#now').innerHTML = nowText(d);
}

    +'<th>句子</th><th>认出是谁</th><th>有情绪</th><th>画外</th><th>一处多句</th><th>标注版本</th></tr></thead><tbody>'
    + (d.eps||[]).map(e=>{

      return '<tr data-ep="'+e.ep+'"><td><b>第 '+e.ep+' 集</b></td>'
        +'<td>'+yn(e.has_lines)+(e.line_count?' <span class="muted">'+e.line_count+'</span>':'')+'</td>'

        +'<td>'+yn(e.has_sentences)+'</td>'
        +'<td>'+e.sentence_count+'</td>'

        +'<td>'+e.emotion_count+' <span class="muted">'+pct(e.emotion_count,e.sentence_count)+'%</span></td>'
        +'<td>'+e.off_screen+'</td>'
        +'<td>'+(e.dense_shots?'<span class="pill warn">'+e.dense_shots+' 处</span>':'<span class="muted">0</span>')+'</td>'
        +'<td class="muted">'+esc(e.shot_version||'—')+'</td></tr>';

    return '<div class="card" style="margin-bottom:10px"><div class="row">'
      +'<span class="pill '+stPill(r.state)+'">'+esc(r.state)+'</span>'
      +'<b>'+esc(r.title)+'</b><span class="muted">'+esc(r.drama+' / '+r.task)
      +' · '+r.seg_count+' 段 · '+esc(r.mtime)+'</span></div>'
      +(r.angle?'<div class="muted" style="margin-top:6px">'+esc(r.angle)+'</div>':'')
      +'<div style="margin-top:8px">'+(docs||'<span class="muted">没有随附的说明文档</span>')+'</div>'

async function openDoc(url, btn){
  state.openDoc = url;
  document.querySelectorAll('.docbtn').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  const box = $('#docview');
  box.innerHTML = '<span class="muted">正在读…</span>';
  try{
    const d = await get(url);
    box.innerHTML = d.error ? '<span class="err">'+esc(d.error)+'</span>'
      : '<div class="muted" style="margin-bottom:8px">'+esc(d.name)+'</div><pre>'+esc(d.text)+'</pre>';
  }catch(e){ box.innerHTML = '<span class="err">'+esc(e.message)+'</span>'; }
}

// ------------------------------------------------------------ 成片预览
let PV = {group:null};

const fmtClock = s => {
  if(s==null || s==='' || isNaN(s)) return '—';
  const t = Math.max(0, Math.round(Number(s)));
  return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
};
const fmtDur = s => s==null ? '—' : fmtClock(s);
const stCls = s => s==='approved' ? 'ok' : (s==='done' ? 'blue'
  : (s==='blocked'||s==='stale' ? 'warn' : ''));
const stTxt = s => ({approved:'已通过',done:'已成片',blocked:'卡住',stale:'要重做',
  in_progress:'在做',pending:'未开工',unlogged:'没登记'}[s] || s || '—');

async function renderVideo(){
  const d = await get('/api/videos');
  const act = d.active || {};
  $('#now').innerHTML = '当前 <b>'+esc(act.drama||'未选')+' / '+esc(act.task||'—')+'</b>';
  const all = d.groups || [];
  if(!all.length) return '<div class="card"><h2>还没有可预览的视频</h2>'
    +'<p class="muted">runs/ 下还没有 mp4。装配出片后这里会自动出现。</p></div>';

  // 默认落到工作台当前选中的那条片子
  const actKey = act.drama && act.task ? act.drama+'/'+act.task : '';
  if(!state.vtask && actKey && all.some(x => x.key === actKey)) state.vtask = actKey;

  const q = (state.vq||'').trim().toLowerCase();
  const visible = all.filter(g => {
    const hay = (g.drama+' '+g.task+' '+g.title+' '+g.angle).toLowerCase();
    return (!q || hay.includes(q)) && (!state.vonly || g.has_current);
  });
  let g = all.find(x => x.key === state.vtask);
  if(!g || !visible.includes(g)) g = visible[0] || all[0];
  state.vtask = g.key;
  PV.group = g;

  let versions = g.versions.filter(v => state.vbuild || v.role !== '装配中间文件');
  // 有的片子只有装配中间文件（还没出成片），不能因此把整组变成空气
  if(!versions.length) versions = g.versions.slice(0, 12);
  const cur = versions.find(v => v.url === state.vurl)
    || versions.find(v => v.url === g.current) || versions[0];
  state.vurl = cur.url;

  const gItem = gg => {
    const cv = gg.versions.find(v => v.url === gg.current) || gg.versions[0];
    const finals = gg.versions.filter(v => v.role==='当前成片' || v.role==='成片').length;
    const cnt = finals ? finals+' 版' : gg.versions.length+' 个文件';
    const hay = (gg.drama+' '+gg.task+' '+gg.title+' '+gg.angle).toLowerCase();
    return '<div class="vgroup'+(gg.key===state.vtask?' on':'')+'" data-key="'+esc(gg.key)+'"'
      +' data-search="'+esc(hay)+'" data-current="'+(gg.has_current?'1':'0')+'">'
      +'<div class="t">'+esc(gg.title)+'</div>'
      +'<div class="s">'+esc(gg.drama+' / '+gg.task)+'</div>'
      +'<div class="n"><span class="vpill '+stCls(gg.trailer_state)+'">'
      +esc(stTxt(gg.trailer_state))+'</span><span class="c">'+cnt+' · '
      +(cv?fmtDur(cv.duration):'—')+'</span></div></div>';
  };

  const vBtn = v => {
    const lb = v.role==='当前成片' ? '当前成片'
      : v.role==='旧版' ? '旧版' : v.role==='成片' ? '成片' : v.name;
    return '<button class="vver'+(v.url===cur.url?' on':'')+'" data-url="'+esc(v.url)+'"'
      +' title="'+esc(v.rel)+'"><span>'+esc(lb)+'</span>'
      +'<span class="dur">'+fmtDur(v.duration)+'</span></button>';
  };

  const meta = [
    ['剧', g.drama], ['片子', g.task],
    ['状态', stTxt(g.trailer_state)+(g.trailer_rev!=null?' · rev '+g.trailer_rev:'')],
    ['循环', '第 '+(g.cycle_round||1)+' 轮'],
    ['时长', fmtDur(cur.duration)],
    ['画面', cur.w ? cur.w+'×'+cur.h : '—'],
    ['大小', cur.size_mb+' MB'],
    ['改于', cur.mtime],
  ];

  const segItems = (g.segs||[]).map((s,i) => {
    const imgs = (s.card_a ? '<img src="'+esc(s.card_a)+'" alt="" loading="lazy">' : '')
      + (s.card_b ? '<img src="'+esc(s.card_b)+'" alt="" loading="lazy">' : '');
    const tm = s.ep!=null
      ? '第'+esc(s.ep)+'集 · '+fmtClock(s.a)+'–'+fmtClock(s.b)
        + (s.dur!=null?' · '+fmtDur(s.dur):'')
      : (s.type==='black' ? '设计黑场' : s.type==='card' ? '字幕卡'
         : (s.type || '非原片段'))
        + (s.dur!=null?' · '+fmtDur(s.dur):'');
    return '<div class="shot" data-seg="'+i+'">'
      + (imgs ? '<div class="im">'+imgs+'</div>' : '')
      + '<div class="lb">'+esc(s.label || ('第 '+(i+1)+' 段'))+'</div>'
      + '<div class="tm">'+tm+'</div></div>';
  }).join('');

  const selfItems = (g.selfchecks||[]).map((im,i) =>
    '<figure data-self="'+i+'"><img src="'+esc(im.url)+'" alt="" loading="lazy">'
    +'<figcaption>'+esc(im.name)+'</figcaption></figure>').join('');

  let h = '<div class="pvlayout"><aside class="pvside">'
    +'<div class="tool"><input type="text" id="vq" placeholder="找剧名 / 片子 / 标题" value="'+esc(state.vq)+'">'
    +'<label><input type="checkbox" id="vonly" '+(state.vonly?'checked':'')+'>只看已成片</label>'
    +'<span class="muted" id="vcount" style="font-size:10px"></span></div>'
    +'<div class="pvlist">'+all.map(gItem).join('')+'</div></aside><div class="pvmain">';

  h += '<div class="pvplayer"><div><video id="player" controls preload="metadata" playsinline src="'
    +esc(cur.url)+'"></video><div class="pvkeys">空格 播放 / 暂停 · ← → 后退 / 前进 5 秒</div></div></div>';

  h += '<div class="card"><div class="pvhead"><div><h2>'+esc(g.title)+'</h2>'
    +(g.angle ? '<div class="sub">'+esc(g.angle)+'</div>' : '')
    +'<div class="pvmeta">'+meta.map(([k,v]) =>
        '<span class="chip">'+k+' <b>'+esc(v)+'</b></span>').join('')+'</div></div></div></div>';

  h += '<div class="vvers"><span class="lb">版本</span>'+versions.map(vBtn).join('')
    + (g.versions.every(v=>v.role==='装配中间文件')
        ? '<span class="muted" style="font-size:11px">这条片子还没出成片，下面是装配中间文件</span>' : '')
    + (!g.has_current && (g.trailer_state==='done' || g.trailer_state==='approved')
        ? '<span class="muted" style="font-size:11px;color:var(--amber)">状态说已出片，但记的成片不在本机'
          +(g.trailer_name?'（'+esc(g.trailer_name)+'）':'')+'</span>' : '')
    +'<button class="act" id="vbuildBtn" style="margin-left:auto;font-size:11px;padding:4px 9px">'
    +(state.vbuild?'收起中间文件':'显示中间文件')+'</button></div>';

  if(segItems){
    h += '<div class="card"><div class="row" style="justify-content:space-between;align-items:baseline">'
      +'<h2 style="margin:0">段落首尾帧 · '+(g.segs||[]).length+' 段</h2>'
      +'<span class="muted">点一段看首帧 / 尾帧和这段的说明</span></div>'
      +'<div class="strip" style="margin-top:10px">'+segItems+'</div></div>';
  }
  if(selfItems){
    h += '<div class="card"><h2>装配自检图 · '+(g.selfchecks||[]).length+' 张</h2>'
      +'<div class="selfgrid" style="margin-top:10px">'+selfItems+'</div></div>';
  }
  h += '</div></div>';
  return h;
}

function applyVideoFilter(){
  const q = (state.vq||'').trim().toLowerCase();
  let n = 0, total = 0;
  document.querySelectorAll('.vgroup').forEach(el => {
    total++;
    const ok = (!q || (el.dataset.search||'').includes(q))
      && (!state.vonly || el.dataset.current === '1');
    el.hidden = !ok;
    if(ok) n++;
  });
  const c = $('#vcount');
  if(c) c.textContent = '显示 '+n+' / '+total;
}

function closeLightbox(){
  const el = $('#lightbox');
  if(el) el.remove();
}
function lightbox(html){
  closeLightbox();
  const el = document.createElement('div');
  el.className = 'lightbox';
  el.id = 'lightbox';
  el.innerHTML = '<div class="box"><button class="lbclose" title="关闭">×</button>'+html+'</div>';
  el.addEventListener('click', e => {
    if(e.target === el || e.target.classList.contains('lbclose')) closeLightbox();
  });
  document.body.appendChild(el);
}
function openSeg(i){
  const s = PV.group && PV.group.segs ? PV.group.segs[i] : null;
  if(!s) return;
  const two = (s.card_a || s.card_b) ? '<div class="two">'
    + (s.card_a? '<img src="'+esc(s.card_a)+'" alt="">' : '')
    + (s.card_b? '<img src="'+esc(s.card_b)+'" alt="">' : '')+'</div>' : '';
  lightbox(two+'<div class="cap"><b>'+esc(s.label||('第 '+(i+1)+' 段'))+'</b>'
    +' · '+(s.ep!=null ? '第 '+esc(s.ep)+' 集 · '+fmtClock(s.a)+'–'+fmtClock(s.b)
      : (s.type==='black'?'设计黑场':s.type==='card'?'字幕卡':(s.type||'非原片段')))
    +(s.dur!=null?'（'+fmtDur(s.dur)+'）':'')
    +'<br>'+esc(s.beats || '（这段没有写说明）')+'</div>');
}
function openSelf(i){
  const im = PV.group && PV.group.selfchecks ? PV.group.selfchecks[i] : null;
  if(!im) return;
  lightbox('<img src="'+esc(im.url)+'" alt=""><div class="cap"><b>'+esc(im.name)+'</b></div>');
}

// ------------------------------------------------------------ 调度
const RENDER = {pipeline:renderPipeline, assets:renderAssets,
                review:renderReview, video:renderVideo};
async function loadAll(){
  const box = $('#tab-'+curTab);
  try{
    box.innerHTML = await RENDER[curTab]();
    const ds = $('#dramaSel');
    if(ds) ds.addEventListener('change', e=>{ state.drama = e.target.value; loadAll(); });
    document.querySelectorAll('.docbtn').forEach(b =>
      b.addEventListener('click', ()=>openDoc(b.dataset.url, b)));
    if(state.openDoc && curTab==='review'){
      const b = [...document.querySelectorAll('.docbtn')].find(x=>x.dataset.url===state.openDoc);
      if(b) openDoc(state.openDoc, b);
    }
    if(curTab==='video'){
      applyVideoFilter();
      const pl = $('#player');
      const t = state.vtimes[state.vurl] || 0;
      if(pl && t > 0.5){
        pl.addEventListener('loadedmetadata', () => {
          try { if(t < pl.duration - 0.5) pl.currentTime = t; } catch(e){}
        }, {once:true});
      }
    }
  }catch(e){
    box.innerHTML = '<div class="card err">读数据出错：'+esc(e.message)+'</div>';
  }
}
// 预览页：列表/版本/首尾帧/自检图都用事件委托，内容重建后依然有效
const videoTab = $('#tab-video');
videoTab.addEventListener('input', e=>{
  if(e.target.id==='vq'){ state.vq = e.target.value; applyVideoFilter(); }
});
videoTab.addEventListener('change', e=>{
  // 「只看已成片」可能把当前选中的片子过滤掉，直接重画，让主区落到新的第一条
  if(e.target.id==='vonly'){ state.vonly = e.target.checked; loadAll(); }
});
videoTab.addEventListener('click', e=>{
  const g = e.target.closest('.vgroup');
  if(g){ state.vtask = g.dataset.key; state.vurl = ''; loadAll(); return; }
  const v = e.target.closest('.vver');
  if(v){
    const pl = $('#player');
    if(pl) state.vtimes[state.vurl] = pl.currentTime;
    state.vurl = v.dataset.url;
    loadAll();
    return;
  }
  const s = e.target.closest('.shot');
  if(s){ openSeg(Number(s.dataset.seg)); return; }
  const im = e.target.closest('.selfgrid figure');
  if(im){ openSelf(Number(im.dataset.self)); return; }
  if(e.target.id==='vbuildBtn'){ state.vbuild = !state.vbuild; loadAll(); }
});
// 记住每条视频播到哪，切版本/切片子回来接着看
videoTab.addEventListener('timeupdate', e=>{
  if(e.target.id==='player') state.vtimes[state.vurl] = e.target.currentTime;
}, true);
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeLightbox(); return; }
  if(curTab!=='video') return;
  const tag = (e.target && e.target.tagName) || '';
  if(tag==='INPUT' || tag==='SELECT' || tag==='TEXTAREA') return;
  const pl = $('#player');
  if(!pl) return;
  if(e.code==='Space'){ e.preventDefault(); pl.paused ? pl.play() : pl.pause(); }
  else if(e.key==='ArrowLeft'){ pl.currentTime = Math.max(0, pl.currentTime - 5); }
  else if(e.key==='ArrowRight'){
    pl.currentTime = Math.min(pl.duration || 0, pl.currentTime + 5);
  }
});

// 支持 #video 这类直达链接，刷新后停在原来的页签
const firstTab = (location.hash || '').replace('#','');
if(['pipeline','assets','review','video'].includes(firstTab)) tab(firstTab);
else loadAll();
// 实时监控：每 2 秒拉一次进度；总览每 6 秒局部刷新数字，不整页重画
startLive();
document.addEventListener('click', e=>{
  if(e.target.closest('#livePause')){
    state.livePaused = !state.livePaused;
    if(state.livePaused) updateLive(lastProgress);
    else liveTick();
  }
});
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) liveTick(); });
</script>
